<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Alpha-Mobil &mdash; Fall&uuml;bersicht</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F4F5F7;
    --surface: #FFFFFF;
    --surface-2: #F0F2F5;
    --border: #E2E5EA;
    --text: #1B2028;
    --text-muted: #667085;
    --text-dim: #98A2B3;
    --accent: #004177;
    --accent-dim: rgba(0, 65, 119, 0.10);
    --navy: #00223E;
    --amber: #C2760F;
    --danger: #D14343;
    --radius: 10px;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }

  /* ---------- Lock screen (identisch zur Hauptkarte) ---------- */
  #lock-screen {
    position: fixed; inset: 0; z-index: 5000;
    background: radial-gradient(circle at 20% 15%, rgba(0,65,119,0.10), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(0,34,62,0.08), transparent 45%), var(--bg);
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .lock-card { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 36px 32px 32px; box-shadow: 0 20px 40px -16px rgba(20,30,50,0.14); }
  .lock-eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 2px; color: var(--accent); text-transform: uppercase; margin-bottom: 10px; }
  .lock-title { font-family: var(--font-display); font-size: 24px; font-weight: 700; margin: 0 0 6px; letter-spacing: -0.2px; }
  .lock-sub { font-size: 13px; color: var(--text-muted); margin: 0 0 26px; line-height: 1.5; }
  .lock-field { position: relative; margin-bottom: 14px; }
  #password-input { width: 100%; background: var(--surface-2); border: 1px solid var(--border); color: var(--text); font-family: var(--font-mono); font-size: 16px; letter-spacing: 3px; padding: 14px 16px; border-radius: 8px; outline: none; transition: border-color 0.15s ease; }
  #password-input:focus { border-color: var(--accent); }
  #password-input::placeholder { color: var(--text-dim); letter-spacing: normal; font-family: var(--font-body); }
  #unlock-btn { width: 100%; background: var(--accent); color: #FFFFFF; border: none; font-family: var(--font-display); font-weight: 600; font-size: 14px; padding: 13px 16px; border-radius: 8px; cursor: pointer; transition: filter 0.15s ease, transform 0.05s ease; }
  #unlock-btn:hover { filter: brightness(1.08); }
  #unlock-btn:active { transform: scale(0.99); }
  #lock-error { color: var(--danger); font-size: 12px; margin-top: 10px; min-height: 16px; font-family: var(--font-mono); }
  .shake { animation: shake 0.35s ease; }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }

  /* ---------- App shell ---------- */
  #app { display: none; flex-direction: column; height: 100vh; }
  body.authed #app { display: flex; }
  body.authed #lock-screen { display: none; }

  header { padding: 14px 24px; background: var(--navy); border-bottom: 1px solid var(--navy); display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 10px; z-index: 900; position: relative; }
  .brand { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 14px; }
  .brand img { height: 30px; width: auto; display: block; }
  header h1 { font-family: var(--font-display); font-size: 15px; font-weight: 500; margin: 0; letter-spacing: 0.2px; color: #E8ECF1; }
  #map-status { font-family: var(--font-mono); font-size: 11px; color: #7C93AA; }
  .header-btn { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.25); color: #fff; font-family: var(--font-body); font-size: 12px; font-weight: 600; padding: 7px 12px; border-radius: var(--radius); cursor: pointer; }
  .header-btn:hover { background: rgba(255,255,255,0.16); border-color: rgba(255,255,255,0.4); }
  .header-btn:disabled { opacity: 0.6; cursor: default; }

  .title-row { padding: 16px 24px 4px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .title-row h2 { font-family: var(--font-display); font-size: 19px; font-weight: 700; margin: 0; }
  .title-row .sub { font-size: 12.5px; color: var(--text-muted); }

  #overview-status { padding: 0 24px 12px; font-size: 12.5px; color: var(--text-muted); font-family: var(--font-mono); }
  #overview-status.err { color: var(--danger); }
  #overview-status.ok { color: var(--accent); }

  #map { position: absolute; inset: 0; }

  .legend { position: absolute; left: 16px; bottom: 16px; z-index: 850; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; font-size: 12px; box-shadow: 0 8px 20px -10px rgba(20,30,50,0.18); }
  .legend-title { font-weight: 700; font-size: 11px; letter-spacing: .03em; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; }
  .legend-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
  .legend-row:last-child { margin-bottom: 0; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; border: 1.5px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,0.15); }

  /* ---------- PLZ-Umkreissuche ---------- */
  .search-panel { position: absolute; right: 16px; top: 16px; z-index: 850; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; box-shadow: 0 8px 20px -10px rgba(20,30,50,0.18); width: 272px; max-width: calc(100vw - 32px); }
  .search-panel-title { font-weight: 700; font-size: 11px; letter-spacing: .03em; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; }
  .search-row { display: flex; gap: 6px; }
  #plz-search-input { flex: 1; min-width: 0; background: var(--surface-2); border: 1px solid var(--border); color: var(--text); font-family: var(--font-mono); font-size: 13px; letter-spacing: 1px; padding: 8px 10px; border-radius: 7px; outline: none; }
  #plz-search-input:focus { border-color: var(--accent); }
  #plz-search-btn { background: var(--accent); color: #fff; border: none; font-family: var(--font-body); font-weight: 600; font-size: 12.5px; padding: 8px 12px; border-radius: 7px; cursor: pointer; white-space: nowrap; }
  #plz-search-btn:hover { filter: brightness(1.08); }
  #plz-search-reset { display: none; background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--border); font-family: var(--font-body); font-weight: 600; font-size: 12.5px; padding: 8px 12px; border-radius: 7px; cursor: pointer; white-space: nowrap; margin-top: 6px; width: 100%; }
  #plz-search-reset:hover { background: var(--border); color: var(--text); }
  #plz-search-status { font-size: 11.5px; color: var(--text-muted); margin-top: 8px; font-family: var(--font-mono); }
  #plz-search-status.err { color: var(--danger); }
  #plz-search-results { margin-top: 8px; max-height: 320px; overflow-y: auto; }
  .psr-item { display: block; padding: 8px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
  .psr-item:last-child { border-bottom: none; }
  .psr-item:hover .psr-name { text-decoration: underline; }
  .psr-name { font-size: 12.5px; font-weight: 600; color: var(--accent); }
  .psr-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .psr-dist { font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); float: right; }

  .case-popup { font-family: var(--font-body); }
  .case-popup .cp-title { font-weight: 700; font-size: 13px; margin-bottom: 6px; }
  .case-popup .cp-card { padding: 6px 0; border-bottom: 1px solid var(--border); }
  .case-popup .cp-card:last-child { border-bottom: none; }
  .case-popup .cp-card a { color: var(--accent); text-decoration: none; font-size: 12.5px; font-weight: 600; }
  .case-popup .cp-card a:hover { text-decoration: underline; }
  .case-popup .cp-meta { font-size: 11px; color: var(--text-muted); margin-top: 1px; }

  @media (max-width: 720px) {
    header { justify-content: center; padding: 10px 14px; gap: 6px; }
    .brand { position: static; transform: none; order: 1; }
    .brand img { height: 22px; }
    .header-btn { order: 2; font-size: 11px; }
    #map-status { order: 3; font-size: 10px; }
    .title-row { padding: 12px 14px 2px; }
    #overview-status { padding: 0 14px 10px; }
  }
</style>
</head>
<body>

  <div id="lock-screen">
    <div class="lock-card">
      <img src="https://www.alpha-mobil.com/bilder/intern/shoplogo/alpha-mobil_logo_white.png" alt="Alpha-Mobil" style="height:26px; width:auto; background:var(--navy); padding:8px 14px; border-radius:8px; margin-bottom:18px;" />
      <div class="lock-eyebrow">Zugang gesichert</div>
      <h1 class="lock-title">Einsatzleitzentrale</h1>
      <p class="lock-sub">Bitte Zugangscode eingeben, um die Fall&uuml;bersicht zu &ouml;ffnen.</p>
      <div class="lock-field">
        <input type="password" id="password-input" placeholder="Zugangscode" autocomplete="off" />
      </div>
      <button id="unlock-btn">Entsperren</button>
      <div id="lock-error"></div>
    </div>
  </div>

  <div id="app">
    <header>
      <div class="brand">
        <img src="https://www.alpha-mobil.com/bilder/intern/shoplogo/alpha-mobil_logo_white.png" alt="Alpha-Mobil" />
      </div>
      <button class="header-btn" id="back-btn" type="button">&larr; Zur Karte</button>
      <button class="header-btn" id="refresh-btn" type="button">&#8635; Aktualisieren</button>
      <div id="map-status"></div>
    </header>

    <div class="title-row">
      <h2>📍 Fall&uuml;bersicht</h2>
      <span class="sub">Permanente Stecknadeln je PLZ &mdash; zeigt, wo sich offene Trello-F&auml;lle gerade h&auml;ufen.</span>
    </div>
    <div id="overview-status">Wird geladen&hellip;</div>

    <div style="position:relative; flex:1; min-height:0;">
      <div id="map"></div>
      <div class="legend">
        <div class="legend-title">F&auml;lle je PLZ</div>
        <div class="legend-row"><span class="legend-dot" style="background:#004177;"></span>1 Fall</div>
        <div class="legend-row"><span class="legend-dot" style="background:#C2760F;"></span>2&ndash;3 F&auml;lle</div>
        <div class="legend-row"><span class="legend-dot" style="background:#D14343;"></span>4+ F&auml;lle</div>
      </div>
      <div class="search-panel">
        <div class="search-panel-title">PLZ-Umkreissuche</div>
        <div class="search-row">
          <input type="text" id="plz-search-input" placeholder="z.B. 20095" maxlength="5" inputmode="numeric" />
          <button id="plz-search-btn" type="button">Suchen</button>
        </div>
        <button id="plz-search-reset" type="button">&#8634; Zur&uuml;cksetzen</button>
        <div id="plz-search-status"></div>
        <div id="plz-search-results"></div>
      </div>
    </div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
  /* ---------- Zugang (gleicher Code/Mechanismus wie die Hauptkarte) ---------- */
  var APP_PASSWORD = "AlpMob2026#";
  var AUTH_KEY = "alpinMobilAuthed";
  var passwordInput = document.getElementById('password-input');
  var unlockBtn = document.getElementById('unlock-btn');
  var lockCard = document.querySelector('.lock-card');
  var lockError = document.getElementById('lock-error');

  function tryUnlock() {
    if (passwordInput.value === APP_PASSWORD) {
      try { sessionStorage.setItem(AUTH_KEY, '1'); } catch (e) {}
      document.body.classList.add('authed');
      initOverview();
    } else {
      lockError.textContent = 'Falscher Zugangscode.';
      lockCard.classList.remove('shake');
      void lockCard.offsetWidth;
      lockCard.classList.add('shake');
    }
  }
  unlockBtn.addEventListener('click', tryUnlock);
  passwordInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') tryUnlock(); });

  var alreadyAuthed = false;
  try { alreadyAuthed = sessionStorage.getItem(AUTH_KEY) === '1'; } catch (e) {}
  if (alreadyAuthed) {
    document.body.classList.add('authed');
  }

  document.getElementById('back-btn').addEventListener('click', function() {
    window.close();
    // Falls window.close() (z.B. wenn der Tab nicht per Skript geöffnet wurde)
    // nichts tut, zur Hauptkarte navigieren statt dass der Button wirkungslos bleibt.
    setTimeout(function() { window.location.href = 'index.html'; }, 150);
  });

  /* ---------- Trello: identische Zugangsdaten + identischer Filter wie die Hauptkarte ---------- */
  var TRELLO_CONFIG_KEY = 'trelloConfigV1';
  var TRELLO_CACHE_KEY = 'trelloDataCacheV1';
  var DEFAULT_TRELLO_API_KEY = '';
  var DEFAULT_TRELLO_TOKEN = '';
  var DEFAULT_TRELLO_BOARD_IDS = [];

  function getTrelloConfig() {
    try {
      var raw = localStorage.getItem(TRELLO_CONFIG_KEY);
      if (raw) {
        var cfg = JSON.parse(raw);
        if (cfg && cfg.apiKey && cfg.token && Array.isArray(cfg.boardIds) && cfg.boardIds.length) return cfg;
      }
    } catch (e) {}
    if (DEFAULT_TRELLO_API_KEY && DEFAULT_TRELLO_TOKEN && DEFAULT_TRELLO_BOARD_IDS.length) {
      return { apiKey: DEFAULT_TRELLO_API_KEY, token: DEFAULT_TRELLO_TOKEN, boardIds: DEFAULT_TRELLO_BOARD_IDS };
    }
    return null;
  }

  function loadTrelloCache() {
    try {
      var raw = localStorage.getItem(TRELLO_CACHE_KEY);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (e) { return null; }
  }

  function extractPlzFromCardName(name) {
    var m = name.match(/\b(\d{5})\b/);
    return m ? m[1] : null;
  }

  // Gleiche Ausschluss-Logik wie in der Hauptkarte: erledigt/fertig/storniert/
  // gesperrt/"keine Rückmeldung"-Listen werden nicht gezählt.
  function fetchTrelloBoard(cfg, boardId) {
    var base = 'https://api.trello.com/1/boards/' + encodeURIComponent(boardId);
    var auth = '?key=' + encodeURIComponent(cfg.apiKey) + '&token=' + encodeURIComponent(cfg.token);
    var boardInfoP = fetch(base + auth + '&fields=name').then(function(r) {
      if (!r.ok) throw new Error('Board ' + boardId + ': HTTP ' + r.status);
      return r.json();
    });
    var listsP = fetch(base + '/lists' + auth + '&fields=name').then(function(r) {
      if (!r.ok) throw new Error('Board ' + boardId + ' (Listen): HTTP ' + r.status);
      return r.json();
    });
    var cardsP = fetch(base + '/cards' + auth + '&fields=name,idList,shortUrl&filter=open&limit=1000').then(function(r) {
      if (!r.ok) throw new Error('Board ' + boardId + ' (Karten): HTTP ' + r.status);
      return r.json();
    });
    return Promise.all([boardInfoP, listsP, cardsP]).then(function(results) {
      var boardInfo = results[0], lists = results[1], cards = results[2];
      var listNameById = {};
      lists.forEach(function(l) { listNameById[l.id] = l.name; });
      var entries = [];
      cards.forEach(function(c) {
        var listName = listNameById[c.idList] || '—';
        if (/erledigt|fertig|storniert|gesperrt|keine\s*r(ü|ue)ckmeldung|keine\s*reaktion|kb\s*an\s*kd|abgelehnt/i.test(listName)) return;
        var plz = extractPlzFromCardName(c.name || '');
        if (!plz) return;
        entries.push({ plz: plz, boardName: boardInfo.name || boardId, listName: listName, cardName: c.name, cardUrl: c.shortUrl });
      });
      return { boardName: boardInfo.name || boardId, entries: entries };
    });
  }

  function buildIndexFromBoards(boards) {
    var index = {};
    boards.forEach(function(b) {
      (b.entries || []).forEach(function(e) {
        if (!index[e.plz]) index[e.plz] = [];
        index[e.plz].push(e);
      });
    });
    return index;
  }

  /* ---------- Karte + Stecknadeln ---------- */
  var map = null;
  var pinLayer = null;
  var searchLayer = null;
  var statusEl = document.getElementById('overview-status');
  var mapStatusEl = document.getElementById('map-status');
  var refreshBtn = document.getElementById('refresh-btn');
  var overviewInitialized = false;

  // Zuletzt geladene Daten, damit die PLZ-Suche ohne erneuten Trello-Abruf
  // funktioniert.
  var lastIndex = null;
  var lastPlzCoords = null;
  var SEARCH_RADIUS_KM = 50; // gleiche Konvention wie die Trello-Umkreissuche in der Hauptkarte
  var DEFAULT_MAP_CENTER = [51.1657, 10.4515];
  var DEFAULT_MAP_ZOOM = 6;

  var searchInputEl = document.getElementById('plz-search-input');
  var searchBtnEl = document.getElementById('plz-search-btn');
  var searchResetEl = document.getElementById('plz-search-reset');
  var searchStatusEl = document.getElementById('plz-search-status');
  var searchResultsEl = document.getElementById('plz-search-results');

  function padPlz(val) {
    if (val === undefined || val === null || val === '') return '';
    var num = parseInt(val, 10);
    if (!isNaN(num) && String(val).trim().match(/^\d+$/)) {
      return String(num).padStart(5, '0');
    }
    return String(val).trim();
  }

  function haversineKm(lat1, lon1, lat2, lon2) {
    var R = 6371;
    var dLat = (lat2 - lat1) * Math.PI / 180;
    var dLon = (lon2 - lon1) * Math.PI / 180;
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
      Math.sin(dLon / 2) * Math.sin(dLon / 2);
    var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
  }

  function escapeAttr(str) {
    return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  }

  function pinColorForCount(n) {
    if (n >= 4) return '#D14343';
    if (n >= 2) return '#C2760F';
    return '#004177';
  }

  function makeCasePinIcon(color) {
    var svg =
      '<svg width="26" height="34" viewBox="0 0 26 34" xmlns="http://www.w3.org/2000/svg">' +
        '<path d="M13 0C5.8 0 0 5.8 0 13c0 9.5 13 21 13 21s13-11.5 13-21C26 5.8 20.2 0 13 0z" fill="' + color + '" stroke="#ffffff" stroke-width="1.5"/>' +
        '<circle cx="13" cy="13" r="5" fill="#ffffff"/>' +
      '</svg>';
    return L.divIcon({
      className: 'case-pin',
      html: svg,
      iconSize: [26, 34],
      iconAnchor: [13, 34],
      popupAnchor: [0, -30]
    });
  }

  // Eine Stecknadel pro Trello-Karte (nicht gebündelt nach PLZ), damit beim
  // Klick immer direkt klar ist, um welche einzelne Karte es sich handelt.
  // Mehrere Karten in derselben PLZ werden minimal auseinandergezogen, damit
  // keine Nadel eine andere komplett verdeckt.
  function renderPins(index, plzCoords) {
    pinLayer.clearLayers();
    var plzList = Object.keys(index);
    var placed = 0;
    plzList.forEach(function(plz) {
      var coord = plzCoords[plz];
      if (!coord) return;
      var entries = index[plz];
      var color = pinColorForCount(entries.length);
      entries.forEach(function(e, i) {
        var offset = entries.length > 1 ? (i - (entries.length - 1) / 2) * 0.012 : 0;
        var icon = makeCasePinIcon(color);
        var popupHtml = '<div class="case-popup"><div class="cp-title">PLZ ' + plz + '</div>' +
          '<div class="cp-card"><a href="' + escapeAttr(e.cardUrl) + '" target="_blank" rel="noopener">' + escapeAttr(e.cardName) + '</a>' +
          '<div class="cp-meta">' + escapeAttr(e.listName) + ' &middot; ' + escapeAttr(e.boardName) + '</div></div></div>';
        L.marker([coord[0], coord[1] + offset], { icon: icon }).addTo(pinLayer).bindPopup(popupHtml, { maxWidth: 280 });
        placed++;
      });
    });
    return placed;
  }

  function loadAndRender() {
    statusEl.className = '';
    statusEl.textContent = 'Trello-Daten werden geladen…';
    refreshBtn.disabled = true;

    var plzCoordsP = fetch('plz-coords.json', { cache: 'force-cache' }).then(function(r) {
      if (!r.ok) throw new Error('plz-coords.json: HTTP ' + r.status);
      return r.json();
    }).catch(function(err) {
      console.warn('plz-coords.json konnte nicht geladen werden', err);
      return {};
    });

    var cfg = getTrelloConfig();
    var dataP;
    if (cfg) {
      dataP = Promise.all(cfg.boardIds.map(function(id) { return fetchTrelloBoard(cfg, id); }))
        .then(function(boards) { return { index: buildIndexFromBoards(boards), live: true }; })
        .catch(function(err) {
          console.error(err);
          var cached = loadTrelloCache();
          if (cached && cached.index) return { index: cached.index, live: false, error: err };
          throw err;
        });
    } else {
      var cached = loadTrelloCache();
      if (cached && cached.index) {
        dataP = Promise.resolve({ index: cached.index, live: false, fromCacheOnly: true });
      } else {
        dataP = Promise.reject(new Error('Keine Trello-Verbindung gefunden.'));
      }
    }

    Promise.all([plzCoordsP, dataP]).then(function(results) {
      var plzCoords = results[0];
      var data = results[1];
      lastIndex = data.index;
      lastPlzCoords = plzCoords;
      var placed = renderPins(data.index, plzCoords);

      if (placed === 0) {
        statusEl.className = '';
        statusEl.textContent = 'Keine offenen Trello-Karten mit PLZ im Titel gefunden.';
      } else {
        statusEl.className = 'ok';
        statusEl.textContent = 'Fälle geladen' +
          (data.live ? ' (live von Trello).' : data.fromCacheOnly ? ' (aus zwischengespeicherten Daten – bitte im Hauptfenster "Trello verbinden" einrichten für Live-Daten).' : ' (aus zwischengespeicherten Daten, Live-Abruf fehlgeschlagen).');
      }
      mapStatusEl.textContent = 'Stand: ' + new Date().toLocaleTimeString('de-DE');
      refreshBtn.disabled = false;
    }).catch(function(err) {
      console.error(err);
      statusEl.className = 'err';
      statusEl.textContent = 'Keine Trello-Verbindung gefunden. Bitte zuerst im Hauptfenster unter "Trello verbinden" einrichten und dort einmal aktualisieren.';
      refreshBtn.disabled = false;
    });
  }

  function initOverview() {
    if (overviewInitialized) { loadAndRender(); return; }
    overviewInitialized = true;
    map = L.map('map', { zoomControl: true, attributionControl: true }).setView(DEFAULT_MAP_CENTER, DEFAULT_MAP_ZOOM);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Esri, HERE, Garmin, FAO, NOAA, USGS, &copy; OpenStreetMap contributors, GIS User Community',
      maxZoom: 16
    }).addTo(map);
    pinLayer = L.layerGroup().addTo(map);
    searchLayer = L.layerGroup().addTo(map);
    setTimeout(function() { map.invalidateSize(); }, 50);
    loadAndRender();
  }

  /* ---------- PLZ-Umkreissuche ---------- */
  function runPlzSearch() {
    var raw = (searchInputEl.value || '').trim();
    searchResultsEl.innerHTML = '';
    searchLayer.clearLayers();

    if (!raw) {
      searchStatusEl.className = 'err';
      searchStatusEl.textContent = 'Bitte eine PLZ eingeben.';
      return;
    }
    var plz = padPlz(raw);
    if (!/^\d{5}$/.test(plz)) {
      searchStatusEl.className = 'err';
      searchStatusEl.textContent = 'Bitte eine gültige 5-stellige PLZ eingeben.';
      return;
    }
    if (!lastPlzCoords || !lastIndex) {
      searchStatusEl.className = 'err';
      searchStatusEl.textContent = 'Daten werden noch geladen – bitte kurz warten.';
      return;
    }
    var origin = lastPlzCoords[plz];
    if (!origin) {
      searchStatusEl.className = 'err';
      searchStatusEl.textContent = 'PLZ ' + plz + ' ist nicht in der Koordinatenliste bekannt.';
      return;
    }

    searchResetEl.style.display = 'block';

    var matches = [];
    Object.keys(lastIndex).forEach(function(casePlz) {
      var coord = lastPlzCoords[casePlz];
      if (!coord) return;
      var dist = haversineKm(origin[0], origin[1], coord[0], coord[1]);
      if (dist > SEARCH_RADIUS_KM) return;
      lastIndex[casePlz].forEach(function(e) {
        matches.push({ plz: casePlz, coord: coord, dist: dist, entry: e });
      });
    });
    matches.sort(function(a, b) { return a.dist - b.dist; });

    // Suchradius als Kreis einzeichnen und Karte darauf zentrieren.
    L.circle([origin[0], origin[1]], { radius: SEARCH_RADIUS_KM * 1000, color: '#004177', weight: 1.5, fillOpacity: 0.04 }).addTo(searchLayer);
    L.marker([origin[0], origin[1]], { icon: L.divIcon({ className: '', html: '<div style="width:10px;height:10px;border-radius:50%;background:#1B2028;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,0.3);"></div>', iconSize: [10, 10], iconAnchor: [5, 5] }) })
      .addTo(searchLayer).bindPopup('Suchzentrum: PLZ ' + plz);
    map.setView([origin[0], origin[1]], 9);

    if (matches.length === 0) {
      searchStatusEl.className = '';
      searchStatusEl.textContent = 'Keine Fälle im Umkreis von ' + SEARCH_RADIUS_KM + ' km um ' + plz + '.';
      return;
    }
    searchStatusEl.className = 'ok';
    searchStatusEl.textContent = matches.length + ' ' + (matches.length === 1 ? 'Fall' : 'Fälle') + ' im Umkreis von ' + SEARCH_RADIUS_KM + ' km um ' + plz + ':';

    matches.forEach(function(m) {
      var item = document.createElement('div');
      item.className = 'psr-item';
      item.innerHTML = '<span class="psr-dist">' + m.dist.toFixed(1) + ' km</span>' +
        '<div class="psr-name">' + escapeAttr(m.entry.cardName) + '</div>' +
        '<div class="psr-meta">PLZ ' + m.plz + ' &middot; ' + escapeAttr(m.entry.listName) + ' &middot; ' + escapeAttr(m.entry.boardName) + '</div>';
      item.addEventListener('click', function() {
        map.setView([m.coord[0], m.coord[1]], 12);
        window.open(m.entry.cardUrl, '_blank', 'noopener');
      });
      searchResultsEl.appendChild(item);
    });
  }

  function resetPlzSearch() {
    searchLayer.clearLayers();
    searchInputEl.value = '';
    searchStatusEl.className = '';
    searchStatusEl.textContent = '';
    searchResultsEl.innerHTML = '';
    searchResetEl.style.display = 'none';
    map.setView(DEFAULT_MAP_CENTER, DEFAULT_MAP_ZOOM);
  }

  searchBtnEl.addEventListener('click', runPlzSearch);
  searchResetEl.addEventListener('click', resetPlzSearch);
  searchInputEl.addEventListener('keydown', function(ev) {
    if (ev.key === 'Enter') runPlzSearch();
  });

  refreshBtn.addEventListener('click', loadAndRender);

  if (alreadyAuthed) {
    initOverview();
  }
</script>
</body>
</html>
