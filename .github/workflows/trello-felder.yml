name: Trello-Felder kopieren (einmalig)

on:
  push:
    branches: [main]
    paths: ['tools/trello/felder_kopieren.py']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kopieren:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Felder von Aufträge Norderstedt ins Test Board kopieren
        env:
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
        run: python3 tools/trello/felder_kopieren.py
      - name: Ergebnis ablegen
        run: |
          git config user.name "Alpha-Mobil Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/trello/ergebnis.txt
          git commit -q -m "Trello-Felder: Ergebnis" || exit 0
          for i in 1 2 3; do git fetch -q origin main && git rebase -q origin/main && git push -q origin HEAD:main && break; sleep 5; done
