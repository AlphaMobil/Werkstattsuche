name: Fallübersicht aktualisieren

on:
  workflow_dispatch:        # Aktualisieren-Button auf den Partnerseiten
  schedule:
    - cron: '18 * * * *'    # stündlich, jeweils um :18 (UTC-Zeitplan, Minute bleibt gleich)

permissions:
  contents: write
  pages: write

concurrency:
  group: falluebersicht
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install cryptography

      - name: Daten aus Trello holen und Seiten bauen
        env:
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          FU_PARTNER: ${{ secrets.FU_PARTNER }}
          FU_DISPATCH_TOKEN: ${{ secrets.FU_DISPATCH_TOKEN }}
          FU_REPO: ${{ github.repository }}
        run: python3 tools/falluebersicht/update.py

      - name: Veröffentlichen
        run: |
          git config user.name "Alpha-Mobil Fallübersicht"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add falluebersicht
          if git diff --cached --quiet; then echo "Keine Änderungen"; exit 0; fi
          git commit -q -m "Fallübersicht: Daten aktualisiert"
          for i in 1 2; do
            git fetch -q origin main && git rebase -q origin/main && git push -q origin HEAD:main && break
            sleep 5
          done

      - name: GitHub Pages neu bauen
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null || true
