<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Alpha-Mobil Fallübersicht</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--fg:#1b2028;--muted:#5d6678;--line:#e2e5ea;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0c1117;--card:#141b24;--fg:#e8edf3;--muted:#a0abba;--line:#232d39;color-scheme:dark}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,sans-serif;padding:24px 16px;box-sizing:border-box}
main{max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}
h1{margin:0 0 8px;font-size:20px} p{margin:0;color:var(--muted)}
</style>
</head>
<body><main><h1>Alpha-Mobil Fallübersicht</h1><p>Bitte nutze den persönlichen Link, den du von Alpha-Mobil bekommen hast.</p></main></body>
</html>
